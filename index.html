<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de Prueba</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #1d4ed8, var(--bg));
        color: var(--text);
      }

      .card {
        width: min(90vw, 560px);
        background: color-mix(in oklab, var(--card) 88%, black);
        border: 1px solid color-mix(in oklab, var(--accent) 45%, transparent);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.6rem, 3vw, 2.3rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        opacity: 0.9;
      }

      .status {
        margin-top: 1.25rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-radius: 999px;
        background: color-mix(in oklab, var(--accent) 20%, transparent);
      }

      .dot {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>¡Página web de prueba lista! 🚀</h1>
      <p>
        Este es un ejemplo básico en HTML y CSS para confirmar que el entorno está
        funcionando correctamente.
      </p>
      <div class="status" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        Estado: activo
      </div>
    </main>
  </body>
</html>
